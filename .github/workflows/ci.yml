name: CI

# THROWAWAY PROBE for the Windows crash in internal/cmd on PR #108.
# Not for merge. Runs the cmd tests verbosely, five separate times, with the
# default Go 1.26 GC and again with the green tea GC turned off.

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe-default:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go version; go env GOEXPERIMENT CGO_ENABLED GOMAXPROCS; [Environment]::ProcessorCount
      - run: go build ./...
      - run: |
          for ($i = 1; $i -le 5; $i++) {
            Write-Host "=== iteration $i ==="
            go test -v -count=1 ./internal/cmd
            if ($LASTEXITCODE -ne 0) { Write-Host "=== iteration $i FAILED ==="; exit 1 }
          }

  probe-nogreentea:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GOEXPERIMENT: nogreenteagc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go version; go env GOEXPERIMENT CGO_ENABLED
      - run: go build ./...
      - run: |
          for ($i = 1; $i -le 5; $i++) {
            Write-Host "=== iteration $i ==="
            go test -v -count=1 ./internal/cmd
            if ($LASTEXITCODE -ne 0) { Write-Host "=== iteration $i FAILED ==="; exit 1 }
          }

  probe-full-nogreentea:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GOEXPERIMENT: nogreenteagc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
