name: CI

# THROWAWAY PROBE for the Windows crash in internal/cmd on PR #108.
# Not for merge. The crash appeared under `go test ./...` on windows-latest
# and never under the cmd package alone, so every job here runs the full
# suite, three separate times, and on a failure prints the test names and
# crash lines from that iteration.

on:
  pull_request:

permissions:
  contents: read

jobs:
  full-default:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go version; go env GOEXPERIMENT CGO_ENABLED; [Environment]::ProcessorCount
      - run: go build ./...
      - run: |
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "=== iteration $i ==="
            go test -v ./... > "full-$i.log" 2>&1
            $code = $LASTEXITCODE
            Select-String -Path "full-$i.log" -Pattern "^(ok|FAIL|\?)" | ForEach-Object { $_.Line }
            if ($code -ne 0) {
              Write-Host "=== iteration $i FAILED; RUN/FAIL/crash lines follow ==="
              Select-String -Path "full-$i.log" -Pattern "^(=== RUN|--- FAIL|panic|fatal error|Exception|runtime: |traceback|goroutine \d+ .*running)" | ForEach-Object { $_.Line }
              exit 1
            }
          }

  full-nogreentea:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOEXPERIMENT: nogreenteagc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go version; go env GOEXPERIMENT CGO_ENABLED
      - run: go build ./...
      - run: |
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "=== iteration $i ==="
            go test -v ./... > "full-$i.log" 2>&1
            $code = $LASTEXITCODE
            Select-String -Path "full-$i.log" -Pattern "^(ok|FAIL|\?)" | ForEach-Object { $_.Line }
            if ($code -ne 0) {
              Write-Host "=== iteration $i FAILED; RUN/FAIL/crash lines follow ==="
              Select-String -Path "full-$i.log" -Pattern "^(=== RUN|--- FAIL|panic|fatal error|Exception|runtime: |traceback|goroutine \d+ .*running)" | ForEach-Object { $_.Line }
              exit 1
            }
          }

  full-default-serial:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: |
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "=== iteration $i (-p 1) ==="
            go test -p 1 -v ./... > "full-$i.log" 2>&1
            $code = $LASTEXITCODE
            Select-String -Path "full-$i.log" -Pattern "^(ok|FAIL|\?)" | ForEach-Object { $_.Line }
            if ($code -ne 0) {
              Write-Host "=== iteration $i FAILED; RUN/FAIL/crash lines follow ==="
              Select-String -Path "full-$i.log" -Pattern "^(=== RUN|--- FAIL|panic|fatal error|Exception|runtime: |traceback|goroutine \d+ .*running)" | ForEach-Object { $_.Line }
              exit 1
            }
          }
