name: Bug report
description: Something is broken or renders wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead? Screenshots of the terminal help a lot — but please crop out real teammate names if your team data is sensitive.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. gh statline
        2. press 2
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `gh statline version`
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: OS and terminal
      placeholder: e.g. Windows 11 / Windows Terminal, macOS / iTerm2, Linux / kitty
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Terminal size (if it's a rendering issue)
      placeholder: e.g. 110×24
