version: "2"

linters:
  default: standard
  enable:
    - misspell
    - nolintlint
    - unconvert
    # The cache runs on a one-connection pool, so a leaked sql.Rows blocks
    # every later query instead of erroring. Both of these are hand-checked
    # discipline today across ~25 query sites in internal/metrics.
    - rowserrcheck
    - sqlclosecheck
    - errorlint
    - bidichk
  settings:
    errcheck:
      # Close/Rollback error returns on these types are not actionable:
      # reads are already checked via rs.Err(), rollback failure surfaces
      # on Commit, and Close-on-error paths have nothing left to do.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback

formatters:
  enable:
    - gofmt
    - goimports
